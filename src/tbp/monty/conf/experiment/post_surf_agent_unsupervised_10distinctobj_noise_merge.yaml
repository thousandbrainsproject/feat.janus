# @package _global_

defaults:
  - /monty: evidencegraph_exp1000_emin_t3_tot2500
  - /monty/motor_system_config: surface_curvature_informed_goal1
  - /monty/learning_module: evidence_1lm_nn5_dod0025
  - /monty/sensor_module: camera_surf
  - /monty/connectivity: 1lm_1sm
  - /environment: mujoco_ycb_surf_agent
  - /env_interface: eval_distinctobj_random
  - /env_interface/transform: missing_depthto3d_sensor2_semantic0_clip
  - /logging: basic_info_monty_runs

experiment:
  _target_: tbp.monty.frameworks.experiments.object_recognition_experiments.MontyObjectRecognitionExperiment
  config:
    show_sensor_output: true
    max_train_steps: 1000
    max_eval_steps: 500
    max_total_steps: 6000
    n_train_epochs: 3
    model_name_or_path: ${constants.janus_pretrained_dir}/surf_agent_unsupervised_10distinctobj_noise/7/
    n_eval_epochs: ${constants.rotations_all_count}
    match_criterion:
      _target_: tbp.monty.experiment.match_criteria.AnyLMsMatch
      count: 1
    seed: 42
    supervised_lm_ids: []
    python_log_level: DEBUG
    logging:
      run_name: post_surf_agent_unsupervised_10distinctobj_noise_merge
